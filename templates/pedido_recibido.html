<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido recibido</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

.contenedor{
    max-width:420px;
    margin:auto;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    background:white;
    border-radius:16px;
    padding:25px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.titulo{
    font-size:26px;
    font-weight:bold;
    color:#2e7d32;
    margin-bottom:15px;
}

.texto{
    color:#555;
    font-size:17px;
    line-height:1.6;
    margin-bottom:25px;
}

.descarga{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
    color:#111;
}

.boton{
    display:block;
    background:#1976d2;
    color:white;
    text-decoration:none;
    padding:14px;
    border-radius:12px;
    font-weight:bold;
    margin-bottom:12px;
}
</style>
</head>

<body>

<div class="contenedor">
    <div class="card">

        <div class="titulo">✅ ¡Tu pedido ya fue enviado!</div>

        <div class="texto">
            En el transcurso de hoy un repartidor se comunicará contigo por <strong>WhatsApp</strong> para coordinar la entrega de tu pedido.<br><br>
            <strong>Recuerda que el pago es contra entrega.</strong>
        </div>

        <div class="descarga">
            📲 ¿Quieres descargar la aplicación?
        </div>

        <a href="/" class="boton">Sí, descargar la aplicación</a>

        <a href="/" class="boton" style="background:#757575;">
            No, volver a la tienda
        </a>

    </div>
</div>

</body>
</html>
