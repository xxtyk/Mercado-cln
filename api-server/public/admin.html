<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin - Mercado en Línea Culiacán</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
  padding-bottom:40px;
}

.barra{
  background:#000;
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:20;
}

.contador-visitas{
  max-width:900px;
  margin:12px auto;
  background:#000;
  color:#fff;
  padding:14px;
  border-radius:16px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

.contenedor{
  max-width:900px;
  margin:0 auto;
  padding:12px;
}

.bloque{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.tab-btn{
  background:#fff;
  border:1px solid #ddd;
  color:#111;
  font-weight:bold;
}

.tab-btn.activa{
  background:#000;
  color:#fff;
}

.seccion{
  display:none;
}

.seccion.activa{
  display:block;
}

input,select,textarea,button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-bottom:10px;
  font-size:17px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:none;
  background:#000;
  color:#fff;
  font-weight:bold;
}

button.sec{
  background:#1976d2;
}

button.danger{
  background:#c62828;
}

button.gray{
  background:#666;
}

.grid{
  display:grid;
  gap:12px;
}

.item{
  background:#fafafa;
  border:1px solid #eee;
  border-radius:16px;
  padding:12px;
}

.item-top{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:10px;
}

.preview{
  width:90px;
  height:90px;
  border-radius:14px;
  object-fit:cover;
  background:#eee;
}

.item-title{
  font-size:18px;
  font-weight:bold;
}

.item-sub{
  color:#666;
  margin-top:4px;
}

.acciones{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.msg{
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  font-weight:bold;
}

.ok{
  background:#e8f5e9;
  color:#1b5e20;
}

.err{
  background:#ffebee;
  color:#b71c1c;
}
</style>
</head>
<body>

<div class="barra">Panel Admin</div>

<div class="contador-visitas">
👁️ Visitas hoy: <span id="visitasHoy">0</span>
</div>

<div class="contenedor">

<div id="mensaje"></div>

<div class="tabs">
<button class="tab-btn activa" id="tabProductosBtn" onclick="mostrarTab('productos')">Productos</button>

<button class="tab-btn" id="tabNuevoBtn" onclick="mostrarTab('nuevo')">Agregar producto</button>

<button class="tab-btn" id="tabCategoriasBtn" onclick="mostrarTab('categorias')">Categorías</button>

<button class="tab-btn" id="tabVendedoresBtn" onclick="mostrarTab('vendedores')">Vendedores</button>
</div>

<div id="tabProductos" class="seccion activa">
<div class="bloque">
<h2>Productos guardados</h2>
<div id="listaProductos" class="grid"></div>
</div>
</div>

<div id="tabNuevo" class="seccion">
<div class="bloque">

<h2 id="tituloFormulario">Agregar producto</h2>

<input id="nuevoNombre" type="text" placeholder="Nombre del producto">

<input id="nuevoPrecio" type="number" placeholder="Precio">

<select id="nuevoCategoria"></select>

<input id="nuevoImagenFile" type="file" accept="image/*">

<textarea id="nuevoDescripcion" placeholder="Descripción"></textarea>

<button onclick="guardarProducto()">Guardar producto</button>

</div>
</div>

<div id="tabCategorias" class="seccion">
<div class="bloque">
<h2>Categorías</h2>
<div id="listaCategorias"></div>
</div>
</div>

<div id="tabVendedores" class="seccion">
<div class="bloque">
<h2>Vendedores</h2>
<div id="listaVendedores"></div>
</div>
</div>

</div>

<script>

const ADMIN_PASSWORD = "mercado2024";

let categorias = [];
let productos = [];
let vendedores = [];

let productoEditando = null;

function authHeaders(){
  return {
    "Content-Type":"application/json",
    "Authorization":`Bearer ${ADMIN_PASSWORD}`
  };
}

function mostrarMensaje(texto, ok=true){

  const box = document.getElementById("mensaje");

  box.innerHTML = `
    <div class="msg ${ok ? "ok":"err"}">
      ${texto}
    </div>
  `;

  setTimeout(()=>{
    box.innerHTML = "";
  },3000);

}

function mostrarTab(tab){

  const tabs = ["productos","nuevo","categorias","vendedores"];

  tabs.forEach(t=>{

    document.getElementById("tab"+capitalizar(t)).classList.remove("activa");

    document.getElementById("tab"+capitalizar(t)+"Btn").classList.remove("activa");

  });

  document.getElementById("tab"+capitalizar(tab)).classList.add("activa");

  document.getElementById("tab"+capitalizar(tab)+"Btn").classList.add("activa");

}

function capitalizar(t){
  return t.charAt(0).toUpperCase()+t.slice(1);
}

async function subirArchivo(file){

  if(!file) return "";

  const formData = new FormData();

  formData.append("file", file);

  const res = await fetch("/api/upload",{
    method:"POST",
    headers:{
      "Authorization":`Bearer ${ADMIN_PASSWORD}`
    },
    body:formData
  });

  const data = await res.json();

  if(!data.ok){
    throw new Error("No se pudo subir imagen");
  }

  return data.url || "";

}

async function cargarCategorias(){

  const res = await fetch("/api/categorias?nocache="+Date.now());

  categorias = await res.json();

  if(!Array.isArray(categorias)){
    categorias = [];
  }

  const select = document.getElementById("nuevoCategoria");

  select.innerHTML = "";

  categorias.forEach(cat=>{

    const op = document.createElement("option");

    op.value = cat.slug;

    op.textContent = cat.nombre;

    select.appendChild(op);

  });

}

async function cargarProductos(){

  const res = await fetch("/api/productos?nocache="+Date.now());

  productos = await res.json();

  if(!Array.isArray(productos)){
    productos = [];
  }

  renderProductos();

}

function renderProductos(){

  const cont = document.getElementById("listaProductos");

  cont.innerHTML = "";

  productos.forEach(p=>{

    const div = document.createElement("div");

    div.className = "item";

    div.innerHTML = `

      <div class="item-top">

        ${
          p.imagen
          ? `<img src="${p.imagen}" class="preview">`
          : `<div class="preview"></div>`
        }

        <div>

          <div class="item-title">
            ${p.nombre}
          </div>

          <div class="item-sub">
            $${Number(p.precio || 0).toFixed(2)}
          </div>

          <div class="item-sub">
            ${p.categoria || ""}
          </div>

        </div>

      </div>

      <div class="acciones">

        <button class="danger" onclick="eliminarProducto(${p.id})">
          Eliminar
        </button>

        <button class="gray" onclick="editarProducto(${p.id})">
          Editar
        </button>

      </div>

    `;

    cont.appendChild(div);

  });

}

function editarProducto(id){

  const p = productos.find(x=>Number(x.id)===Number(id));

  if(!p){
    mostrarMensaje("Producto no encontrado", false);
    return;
  }

  productoEditando = p.id;

  document.getElementById("nuevoNombre").value = p.nombre || "";

  document.getElementById("nuevoPrecio").value = Number(p.precio || 0);

  document.getElementById("nuevoCategoria").value = p.categoria || "";

  document.getElementById("nuevoDescripcion").value = p.descripcion || "";

  document.getElementById("tituloFormulario").textContent = "Editar producto";

  mostrarTab("nuevo");

}

async function guardarProducto(){

  const nombre = document.getElementById("nuevoNombre").value.trim();

  const precio = document.getElementById("nuevoPrecio").value.trim();

  const categoria = document.getElementById("nuevoCategoria").value;

  const descripcion = document.getElementById("nuevoDescripcion").value.trim();

  const file = document.getElementById("nuevoImagenFile").files[0];

  if(!nombre){
    mostrarMensaje("Ponle nombre", false);
    return;
  }

  if(precio === ""){
    mostrarMensaje("Ponle precio", false);
    return;
  }

  try{

    let imagen = "";

    if(productoEditando){

      const viejo = productos.find(p=>Number(p.id)===Number(productoEditando));

      imagen = viejo?.imagen || "";

    }

    if(file){

      imagen = await subirArchivo(file);

    }

    const payload = {

      nombre,

      precio:Number(precio),

      categoria,

      descripcion,

      imagen,

      etiqueta:"Nuevo"

    };

    let res;

    if(productoEditando){

      res = await fetch(`/api/admin/producto/${productoEditando}`,{

        method:"PUT",

        headers:authHeaders(),

        body:JSON.stringify(payload)

      });

    }else{

      res = await fetch("/api/admin/producto",{

        method:"POST",

        headers:authHeaders(),

        body:JSON.stringify(payload)

      });

    }

    const data = await res.json();

    if(!data.ok){

      mostrarMensaje(data.error || "Error", false);

      return;

    }

    document.getElementById("nuevoNombre").value = "";

    document.getElementById("nuevoPrecio").value = "";

    document.getElementById("nuevoDescripcion").value = "";

    document.getElementById("nuevoImagenFile").value = "";

    productoEditando = null;

    document.getElementById("tituloFormulario").textContent = "Agregar producto";

    mostrarMensaje("Producto guardado");

    await cargarProductos();

    mostrarTab("productos");

  }catch(e){

    mostrarMensaje(e.message,false);

  }

}

async function eliminarProducto(id){

  if(!confirm("¿Eliminar producto?")) return;

  const res = await fetch(`/api/admin/producto/${id}`,{
    method:"DELETE",
    headers:authHeaders()
  });

  const data = await res.json();

  if(!data.ok){

    mostrarMensaje("No se pudo eliminar", false);

    return;

  }

  mostrarMensaje("Producto eliminado");

  await cargarProductos();

}

async function cargarVisitas(){

  try{

    const res = await fetch("/api/visitas-hoy");

    const data = await res.json();

    document.getElementById("visitasHoy").textContent = data.total || 0;

  }catch{

    document.getElementById("visitasHoy").textContent = "0";

  }

}

async function iniciar(){

  await cargarCategorias();

  await cargarProductos();

  await cargarVisitas();

}

iniciar();

</script>

</body>
</html>
